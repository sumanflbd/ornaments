<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrnaLuxe - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fffaf5;
      margin: 0;
      color: #333;
    }
    header, footer {
      background-color: #e0b0ff;
      padding: 1rem 2rem;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    nav a {
      margin: 0 0.7rem;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      position: relative;
    }
    nav a i.fa-shopping-cart {
      font-size: 1.2rem;
      vertical-align: middle;
    }
    .cart-badge {
      position: absolute;
      top: -5px;
      right: -10px;
      background-color: red;
      color: white;
      border-radius: 50%;
      padding: 0 5px;
      font-size: 0.7rem;
    }
    .hero {
      background: linear-gradient(to right, #ffddee, #ffe0f0);
      padding: 3rem 2rem;
      text-align: center;
      color: #800080;
    }
    .hero h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .hero button {
      background-color: #800080;
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }
    .hero button:hover {
      background-color: #9932cc;
    }
    main {
      padding: 2rem;
    }
    h2 {
      text-align: center;
      color: #800080;
    }
    .new-arrivals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .product {
      background: #fdf1ff;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(128,0,128,0.15);
      transition: transform 0.3s ease;
    }
    .product:hover {
      transform: translateY(-5px);
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }
    .product h3 {
      margin: 0.7rem 0 0.3rem;
    }
    .product p {
      margin: 0.2rem 0;
    }
    .add-btn {
      background-color: #800080;
      color: white;
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 8px;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    .add-btn:hover {
      background-color: #9932cc;
    }
    @media (max-width: 600px) {
      nav {
        flex-basis: 100%;
        text-align: center;
        margin-top: 0.5rem;
      }
    }
    footer {
  background-color: #e0b0ff;
  padding: 1rem 2rem;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.social-logos {
  margin-top: 0.7rem;
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
}

.social-logos img {
  width: 32px;
  height: 32px;
  transition: transform 0.3s ease;
}

.social-logos a:hover img {
  transform: scale(1.2);
}
  </style>
</head>
<body>

<header>
  <h1><i class="fas fa-gem"></i> OrnaLuxe</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact Us</a>
    <a href="products.html#cartSection" title="View Cart">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-badge" id="cartCount">0</span>
    </a>
  </nav>
</header>

<div class="hero">
  <h2>Spring Sale is Live!</h2>
  <p>Get up to 30% off on selected ornaments. Limited time only!</p>
  <button onclick="window.location.href='products.html'">Shop Now</button>
</div>

<main>
  <h2>New Arrivals</h2>
  <div class="new-arrivals">
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Pearl+Earrings" alt="Pearl Earrings">
      <h3>Pearl Earrings</h3>
      <p>BDT 299</p>
      <button class="add-btn" onclick="addToCart()">Buy Now</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Golden+Anklet" alt="Golden Anklet">
      <h3>Golden Anklet</h3>
      <p>BDT 199</p>
      <button class="add-btn" onclick="addToCart()">Buy Now</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Crystal+Necklace" alt="Crystal Necklace">
      <h3>Crystal Necklace</h3>
      <p>BDT 349</p>
      <button class="add-btn" onclick="addToCart()">Buy Now</button>
    </div>
  </div>
</main>

<footer>
  <p>&copy; 2025 OrnaLuxe. All rights reserved.</p>
  <div class="social-logos">
    <a href="https://facebook.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg" alt="Facebook">
    </a>
    <a href="https://instagram.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
    </a>
    <i class="fa-brands fa-x-twitter"></i>
    <a href="https://wa.me/8801XXXXXXXXX" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </a>
  </div>
</footer>
<script>
  let cartCount = 0;
  function addToCart() {
    cartCount++;
    document.getElementById('cartCount').textContent = cartCount;
  }
</script>

</body>
</html>
